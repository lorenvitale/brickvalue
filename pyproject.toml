[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brickvalue"
version = "1.0.0"
description = "Sistema completo per la valutazione di immobili (valore commerciale, di ricostruzione, bancario e assicurativo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "brickvalue" }]
keywords = ["estimo", "real-estate", "valuation", "appraisal", "immobili"]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
brickvalue = "brickvalue.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["brickvalue*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
